name: T097 Bubblewrap Linux Guest Acceptance

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: t097-host-acceptance
  cancel-in-progress: false

jobs:
  trusted-main-only:
    name: Restrict guest acceptance to main
    runs-on: ubuntu-24.04
    steps:
      - name: Require trusted main ref
        env:
          GITHUB_REF: ${{ github.ref }}
        run: test "$GITHUB_REF" = refs/heads/main

  t097-qemu-guest:
    name: Linux isolation and recovery in pinned QEMU guest
    needs: trusted-main-only
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CAO_WORK_BROKER_ACCOUNT: ${{ vars.CAO_WORK_BROKER_ACCOUNT }}

    steps:
      - name: Checkout trusted main source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # uv runs in the disposable guest; the host cache path stays empty.
          enable-cache: false

      - name: Boot pinned Linux guest and run T097 acceptance
        shell: bash
        run: bash .github/scripts/t097-qemu-acceptance.sh
